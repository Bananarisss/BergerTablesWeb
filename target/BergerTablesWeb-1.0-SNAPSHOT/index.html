<!DOCTYPE html>
<html>
<head>
    <title>Berger Tables Generator</title>
    <meta charset="UTF-8">
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px;
            text-align: center;
        }
        textarea { 
            width: 80%; 
            height: 150px; 
            padding: 10px; 
            border-radius: 2px;
            border: 1px solid #213448;
        }
        .container { 
            width: 50%;
            margin: 32px auto; 
            padding: 50px 20px 30px 20px;
            border-radius: 2px;
            background: white;
            background-color: #94B4C1;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #213448;
        }
        button{ 
            background-color: #213448;
            color: white;
            padding: 10px 20px; 
            font-size: 16px; 
            margin-top: 25px; 
            cursor: pointer;
            border-radius: 2px;
            border: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        button:hover{
            background-color: #547792;
            color: #f4f4f4;
        }
    </style>
</head>
<body>
    <h1 style="color: #1a2938;">Berger Table Generator</h1>
    <p style="color: #1a2938;">Enter team names (one per line):</p>
    <div class="container">
        <form action="BergerTablesServlet" method="get">
            <textarea id="teamsNames" name="teamsNames" placeholder="Team A&#10;Team B&#10;Team C"></textarea>
            <br>
            <button type="submit">Generate Table</button>
        </form>
        <form action="HistoryServlet" method="get">
            <button type="submit">Show History</button>
        </form>
    </div>

</body>
</html>
